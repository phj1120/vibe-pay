services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vibepay
      POSTGRES_USER: vibepay
      POSTGRES_PASSWORD: vibepay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibepay"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
