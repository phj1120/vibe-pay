spring:
  application:
    name: api

  datasource:
    primary:
      jdbc-url: jdbc:postgresql://localhost:5432/vibepay
      username: vibepay
      password: vibepay
      driver-class-name: org.postgresql.Driver
    secondary:
      jdbc-url: jdbc:postgresql://localhost:5432/vibepay
      username: vibepay
      password: vibepay
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: false
    open-in-view: false

# JWT Settings
jwt:
  secret: vibepay-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  # Access Token 만료 시간: 30초 (테스트용)
  access-token-expiration: 30000
  # Refresh Token 만료 시간: 2시간 (7200000ms = 2 hours)
  refresh-token-expiration: 7200000

