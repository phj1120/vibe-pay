spring:
  cloud:
    gateway:
      routes:
        - id: goods-service
          uri: http://goods-service:8082
          predicates:
            - Path=/api/goods/**
        - id: core-service
          uri: http://core-service:8081
          predicates:
            - Path=/api/members/**,/api/auth/**,/api/baskets/**,/api/point/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**
        - id: claim-service
          uri: http://claim-service:8085
          predicates:
            - Path=/api/claim/**
        - id: monolith
          uri: http://monolith:8083
          predicates:
            - Path=/api/**
