spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: goods-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/goods/**
        - id: core-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/members/**,/api/auth/**,/api/baskets/**,/api/point/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**
        - id: claim-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/claim/**
        - id: monolith
          uri: http://localhost:8083
          predicates:
            - Path=/api/**

server:
  port: 8080

jwt:
  secret: vibepay-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  access-token-expiration: 30000
  refresh-token-expiration: 7200000

management:
  endpoints:
    web:
      exposure:
        include: health,info
