spring:
  application:
    name: goods-service

  datasource:
    url: jdbc:postgresql://localhost:5432/vibepay
    username: vibepay
    password: vibepay
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
